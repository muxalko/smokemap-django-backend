name: Backend checks

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  production-image:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: local-ci-only-production-image-key-with-at-least-fifty-characters
      DJANGO_ALLOWED_HOSTS: api.staging.example.com
      CORS_ALLOWED_ORIGINS: https://staging.example.com
      CSRF_TRUSTED_ORIGINS: https://staging.example.com
      DJANGO_TRUST_X_FORWARDED_PROTO: "true"
      POSTGRES_HOST: postgres.internal.example.com
      POSTGRES_PORT: "5432"
      POSTGRES_DB: smokemap
      POSTGRES_USER: smokemap
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_OPTIONS: "-c search_path=smokemap"
      POSTGRES_SSLMODE: verify-full
      AWS_ACCESS_KEY_ID: local-ci-only
      AWS_SECRET_ACCESS_KEY: local-ci-only
      AWS_REGION: us-east-1
      AWS_STORAGE_BUCKET_NAME: smokemap-public-ci
      AWS_S3_ENDPOINT_URL: https://objects.staging.example.com
      AWS_S3_ADDRESSING_STYLE: path
      MEDIA_STORAGE_BUCKET_NAME: smokemap-private-ci
      MEDIA_STORAGE_IDENTIFIER: staging-ci
      MEDIA_STORAGE_INTERNAL_ENDPOINT_URL: http://storage.internal:9000
      MEDIA_UPLOAD_ENDPOINT_URL: https://uploads.staging.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source identity
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build production image
        run: >-
          docker build
          --target production
          --build-arg VCS_REF="$SOURCE_SHA"
          --tag smokemap-backend:ci
          .
      - name: Inspect production image contract
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' smokemap-backend:ci)" = "smokemap"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' smokemap-backend:ci)" = "$SOURCE_SHA"
          docker run --rm --network none --entrypoint python smokemap-backend:ci docker/check_image.py production
          docker run --rm --entrypoint python smokemap-backend:ci \
            -m unittest backend.test_production_configuration backend.test_dependency_manifests backend.test_native_runtime -v
          docker run --rm --network none --entrypoint python smokemap-backend:ci \
            -m unittest discover -s docker -p 'test_*.py' -v
          if docker run --rm --entrypoint python smokemap-backend:ci \
            -c 'import smokemap.settings'; then
            echo "staging settings unexpectedly accepted a missing environment" >&2
            exit 1
          fi
      - name: Capture production dependency evidence
        run: |
          mkdir -p dependency-evidence
          date --utc --iso-8601=seconds > dependency-evidence/captured-at.txt
          printf '%s\n' "$SOURCE_SHA" > dependency-evidence/source-sha.txt
          sha256sum Dockerfile requirements.txt docker/requirements-installer.txt > dependency-evidence/build-inputs.sha256
          docker run --rm --entrypoint python smokemap-backend:ci --version > dependency-evidence/python.txt
          docker run --rm --entrypoint python smokemap-backend:ci -m django --version > dependency-evidence/django.txt
          docker run --rm --network none --entrypoint python smokemap-backend:ci docker/check_image.py production > dependency-evidence/production-runtime.json
          docker run --rm --network none --entrypoint cat smokemap-backend:ci /usr/local/share/smokemap/dependencies/build-inspect.json > dependency-evidence/production-build-inspect.json
          docker run --rm --network none --entrypoint cat smokemap-backend:ci /usr/local/share/smokemap/dependencies/build-freeze.txt > dependency-evidence/production-build-freeze.txt
          docker image inspect smokemap-backend:ci --format '{{.Id}}' > dependency-evidence/local-image-id.txt
          docker image inspect smokemap-backend:ci --format '{{.Size}}' > dependency-evidence/local-image-size.txt
      - name: Build and check development image
        run: |
          docker build --target development --build-arg VCS_REF="$SOURCE_SHA" --tag smokemap-backend:development-ci .
          docker run --rm --entrypoint python smokemap-backend:development-ci -m pip check
          docker run --rm --network none --user 10001:10001 --entrypoint python smokemap-backend:development-ci docker/check_image.py development > dependency-evidence/development-runtime.json
          docker run --rm --entrypoint python smokemap-backend:development-ci -c 'import fiona, pandas; print(fiona.__version__, pandas.__version__)'
          docker run --rm --entrypoint python smokemap-backend:development-ci -m pip inspect > dependency-evidence/development-image-inspect.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-dependency-evidence
          path: dependency-evidence/
      - name: Start Gunicorn and probe liveness
        shell: bash
        run: |
          container_id="$(docker run --detach --rm \
            --env DJANGO_SECRET_KEY \
            --env DJANGO_ALLOWED_HOSTS \
            --env CORS_ALLOWED_ORIGINS \
            --env CSRF_TRUSTED_ORIGINS \
            --env DJANGO_TRUST_X_FORWARDED_PROTO \
            --env POSTGRES_HOST \
            --env POSTGRES_PORT \
            --env POSTGRES_DB \
            --env POSTGRES_USER \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_OPTIONS \
            --env POSTGRES_SSLMODE \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env AWS_REGION \
            --env AWS_STORAGE_BUCKET_NAME \
            --env AWS_S3_ENDPOINT_URL \
            --env AWS_S3_ADDRESSING_STYLE \
            --env MEDIA_STORAGE_BUCKET_NAME \
            --env MEDIA_STORAGE_IDENTIFIER \
            --env MEDIA_STORAGE_INTERNAL_ENDPOINT_URL \
            --env MEDIA_UPLOAD_ENDPOINT_URL \
            smokemap-backend:ci)"
          trap 'docker logs "$container_id"; docker stop "$container_id" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container_id" python -c "import json, urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/live/', headers={'Host': 'api.staging.example.com', 'X-Forwarded-Proto': 'https'}); assert json.load(urllib.request.urlopen(request, timeout=2)) == {'status': 'ok'}"; then
              docker exec "$container_id" python manage.py check --deploy
              docker exec -i "$container_id" python - <<'PYCODE'
          import json
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              'http://127.0.0.1:8000/health/ready/',
              headers={'Host': 'api.staging.example.com', 'X-Forwarded-Proto': 'https'},
          )
          try:
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 503
              assert json.load(error) == {'status': 'unavailable'}
          else:
              raise AssertionError('unreachable database was ready')
          PYCODE
              exit 0
            fi
            sleep 1
          done
          exit 1

  test:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker/compose.ci.yml
      COMPOSE_PROJECT_NAME: smokemap-gdal-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Inspect isolated candidate configuration
        run: docker compose config --quiet
      - name: Build candidate and start isolated PostGIS
        run: |
          docker compose build backend
          docker compose up --detach --wait db
      - name: Check installed dependency compatibility
        run: docker compose run --rm backend python -m pip check
      - name: Capture development dependency closure
        run: |
          mkdir -p dependency-evidence
          date --utc --iso-8601=seconds > dependency-evidence/captured-at.txt
          git rev-parse HEAD > dependency-evidence/source-sha.txt
          docker image inspect "smokemap-gdal-backend:$COMPOSE_PROJECT_NAME" --format '{{.Id}}' > dependency-evidence/development-image-id.txt
          test "$(docker image inspect "smokemap-gdal-backend:$COMPOSE_PROJECT_NAME" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$(git rev-parse HEAD)"
          docker compose run --rm backend python -m pip inspect > dependency-evidence/development-inspect.json
          docker compose run --rm backend python -m pip freeze --all > dependency-evidence/development-freeze.txt
          docker compose run --rm backend python -c 'import fiona, pandas; print(fiona.__version__, pandas.__version__)'
      - name: Focused native and installer regressions
        run: |
          docker compose run --rm backend python -m unittest backend.test_native_runtime -v
          docker compose run --rm backend python -m unittest discover -s docker -p 'test_*.py' -v
      - run: docker compose run --rm backend python manage.py check
      - name: Check migration drift
        run: docker compose run --rm backend python manage.py makemigrations --check --dry-run
      - name: Apply migrations for plan inspection
        run: |
          docker compose run --rm backend python manage.py migrate --plan
          docker compose run --rm backend python manage.py migrate --noinput
      - name: Run backend tests
        shell: bash
        run: |
          output_file="$(mktemp)"
          if ! docker compose run --rm backend python manage.py test 2>&1 | tee "$output_file"; then
            message="$(tail -n 15 "$output_file" | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Backend test failure::$message"
            exit 1
          fi
      - name: Inspect representative place-search plans
        shell: bash
        run: |
          output_file="$(mktemp)"
          if ! docker compose run --rm backend python manage.py inspect_place_search_plans 2>&1 | tee "$output_file"; then
            message="$(tail -n 15 "$output_file" | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Place-search plan failure::$message"
            exit 1
          fi
      - name: Benchmark representative viewport plan
        run: docker compose run --rm backend python manage.py benchmark_viewport_places
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-dependency-evidence
          path: dependency-evidence/
      - name: Stop disposable candidate services
        if: always()
        run: docker compose down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan full history with redacted findings
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
