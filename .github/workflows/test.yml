name: Backend checks

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smokemap_ci
          POSTGRES_USER: smokemap_ci
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smokemap_ci -d smokemap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SETTINGS_MODE: local
      DJANGO_SECRET_KEY: local-ci-only-django-key
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: smokemap_ci
      POSTGRES_USER: smokemap_ci
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_OPTIONS: "-c search_path=public"
      AWS_ACCESS_KEY_ID: local-ci-only
      AWS_SECRET_ACCESS_KEY: local-ci-only
      AWS_REGION: us-east-1
      AWS_STORAGE_BUCKET_NAME: local-ci-only
      AWS_S3_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_S3_ADDRESSING_STYLE: path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install geospatial libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends binutils gdal-bin libproj-dev
      - run: python -m pip install --requirement requirements.txt
      - run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations for plan inspection
        run: python manage.py migrate --noinput
      - name: Run backend tests
        shell: bash
        run: |
          output_file="$(mktemp)"
          if ! python manage.py test 2>&1 | tee "$output_file"; then
            message="$(tail -n 15 "$output_file" | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Backend test failure::$message"
            exit 1
          fi
      - name: Inspect representative place-search plans
        shell: bash
        run: |
          output_file="$(mktemp)"
          if ! python manage.py inspect_place_search_plans 2>&1 | tee "$output_file"; then
            message="$(tail -n 15 "$output_file" | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Place-search plan failure::$message"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with redacted findings
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
