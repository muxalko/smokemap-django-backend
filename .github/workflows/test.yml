name: Backend checks

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  production-image:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: local-ci-only-production-image-key-with-at-least-fifty-characters
      DJANGO_ALLOWED_HOSTS: api.staging.example.com
      CORS_ALLOWED_ORIGINS: https://staging.example.com
      CSRF_TRUSTED_ORIGINS: https://staging.example.com
      DJANGO_TRUST_X_FORWARDED_PROTO: "true"
      POSTGRES_HOST: postgres.internal.example.com
      POSTGRES_PORT: "5432"
      POSTGRES_DB: smokemap
      POSTGRES_USER: smokemap
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_OPTIONS: "-c search_path=smokemap"
      POSTGRES_SSLMODE: verify-full
      AWS_ACCESS_KEY_ID: local-ci-only
      AWS_SECRET_ACCESS_KEY: local-ci-only
      AWS_REGION: us-east-1
      AWS_STORAGE_BUCKET_NAME: smokemap-public-ci
      AWS_S3_ENDPOINT_URL: https://objects.staging.example.com
      AWS_S3_ADDRESSING_STYLE: path
      MEDIA_STORAGE_BUCKET_NAME: smokemap-private-ci
      MEDIA_STORAGE_IDENTIFIER: staging-ci
      MEDIA_STORAGE_INTERNAL_ENDPOINT_URL: http://storage.internal:9000
      MEDIA_UPLOAD_ENDPOINT_URL: https://uploads.staging.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: >-
          docker build
          --target production
          --build-arg VCS_REF="$GITHUB_SHA"
          --tag smokemap-backend:ci
          .
      - name: Inspect production image contract
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' smokemap-backend:ci)" = "smokemap"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' smokemap-backend:ci)" = "$GITHUB_SHA"
          docker run --rm --entrypoint python smokemap-backend:ci -m pip check
          docker run --rm --entrypoint python smokemap-backend:ci \
            -m unittest backend.test_production_configuration backend.test_dependency_manifests -v
          if docker run --rm --entrypoint python smokemap-backend:ci \
            -c 'import smokemap.settings'; then
            echo "staging settings unexpectedly accepted a missing environment" >&2
            exit 1
          fi
      - name: Start Gunicorn and probe liveness
        shell: bash
        run: |
          container_id="$(docker run --detach --rm \
            --env DJANGO_SECRET_KEY \
            --env DJANGO_ALLOWED_HOSTS \
            --env CORS_ALLOWED_ORIGINS \
            --env CSRF_TRUSTED_ORIGINS \
            --env DJANGO_TRUST_X_FORWARDED_PROTO \
            --env POSTGRES_HOST \
            --env POSTGRES_PORT \
            --env POSTGRES_DB \
            --env POSTGRES_USER \
            --env POSTGRES_PASSWORD \
            --env POSTGRES_OPTIONS \
            --env POSTGRES_SSLMODE \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env AWS_REGION \
            --env AWS_STORAGE_BUCKET_NAME \
            --env AWS_S3_ENDPOINT_URL \
            --env AWS_S3_ADDRESSING_STYLE \
            --env MEDIA_STORAGE_BUCKET_NAME \
            --env MEDIA_STORAGE_IDENTIFIER \
            --env MEDIA_STORAGE_INTERNAL_ENDPOINT_URL \
            --env MEDIA_UPLOAD_ENDPOINT_URL \
            smokemap-backend:ci)"
          trap 'docker logs "$container_id"; docker stop "$container_id" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$container_id" python -c "import json, urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/live/', headers={'Host': 'api.staging.example.com', 'X-Forwarded-Proto': 'https'}); assert json.load(urllib.request.urlopen(request, timeout=2)) == {'status': 'ok'}"; then
              docker exec "$container_id" python manage.py check
              exit 0
            fi
            sleep 1
          done
          exit 1

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smokemap_ci
          POSTGRES_USER: smokemap_ci
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smokemap_ci -d smokemap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SETTINGS_MODE: local
      DJANGO_SECRET_KEY: local-ci-only-django-key
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: smokemap_ci
      POSTGRES_USER: smokemap_ci
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_OPTIONS: "-c search_path=public"
      AWS_ACCESS_KEY_ID: local-ci-only
      AWS_SECRET_ACCESS_KEY: local-ci-only
      AWS_REGION: us-east-1
      AWS_STORAGE_BUCKET_NAME: local-ci-only
      AWS_S3_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_S3_ADDRESSING_STYLE: path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install geospatial libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends binutils gdal-bin libproj-dev
      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations for plan inspection
        run: python manage.py migrate --noinput
      - name: Run backend tests
        shell: bash
        run: |
          output_file="$(mktemp)"
          if ! python manage.py test 2>&1 | tee "$output_file"; then
            message="$(tail -n 15 "$output_file" | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Backend test failure::$message"
            exit 1
          fi
      - name: Inspect representative place-search plans
        shell: bash
        run: |
          output_file="$(mktemp)"
          if ! python manage.py inspect_place_search_plans 2>&1 | tee "$output_file"; then
            message="$(tail -n 15 "$output_file" | sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Place-search plan failure::$message"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with redacted findings
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
